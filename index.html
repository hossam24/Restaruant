<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="__BRAND_THEME__" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved light/dark choice before first paint so the page never flashes the wrong theme.
      try {
        var t = localStorage.getItem('menu-theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <title>__BRAND_NAME__ - المنيو</title>
    <meta name="description" content="__BRAND_DESCRIPTION__" />

    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:title" content="__BRAND_NAME__" />
    <meta property="og:description" content="__BRAND_DESCRIPTION__" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>الموقع محتاج JavaScript عشان يشتغل.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
